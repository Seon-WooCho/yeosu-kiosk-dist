<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>여수 AI 스마트 여행안내</title>
<link rel="stylesheet" href="css/v2.css">
</head>
<body>
<!--
  새 화면 구성 (1차 샘플)
  ┌ 상단 고정: assets/v2/top.jpg
  ├ 가운데: [축제·행사] 영상 2칸 교차 재생  /  [여수 10경 관광지도] 지도 → 확대 화면
  ├ 하단 고정: AI 여행 가이드 카드 (assets/v2/guide.jpg 위에 터치 영역)
  └ 맨 아래 바: 처음 화면 · 언어 · 여수시(관리자: 5번 터치)
  내용은 구글 시트(data/kiosk-data.json)에서 옵니다. 이전 데모 화면은 legacy.html
-->
<div class="stage-wrap">
<main class="stage" id="stage">
  <header class="top"><img src="assets/v2/top.jpg" alt="여수 AI 스마트 여행안내"></header>

  <section class="mid" id="mid">
    <div class="panel" id="homePanel">
      <div class="slots" id="slots">
        <div class="slot" data-slot="0"><div class="slot-media"></div><div class="slot-cap"></div></div>
        <div class="slot" data-slot="1"><div class="slot-media"></div><div class="slot-cap"></div></div>
      </div>
      <button class="sound" id="soundBtn"><span id="soundLabel"></span></button>
      <p class="empty" id="homeEmpty" hidden></p>
    </div>

    <div class="panel" id="mapPanel" hidden>
      <div class="map" id="map">
        <img src="assets/v2/map.jpg" alt="">
        <span class="map-note">예시 지도 · 10경 디자인 지도로 교체 예정</span>
        <div class="pins" id="pins"></div>
      </div>
    </div>

    <!-- 확대 지도: 시트의 '확대지도 이미지'가 있으면 그 그림, 없으면 기초 지도를 그 번호 쪽으로 확대 -->
    <div class="panel detail" id="detailPanel" hidden>
      <div class="zoom" id="zoom"><img id="zoomImg" alt=""><span class="zoom-pin" id="zoomPin"></span></div>
      <div class="d-media" id="dMedia"></div>
      <div class="d-head">
        <span class="d-no" id="dNo"></span><h2 id="dName"></h2>
        <button class="big" id="dSound"></button>
      </div>
      <div class="d-btns"><button id="dPrev"></button><button id="dNext"></button><button id="dMap"></button></div>
      <div class="d-body" id="dBody"></div>
    </div>

    <!-- 스케치의 고정 영역 'ai스마트안내 관광지도 — 누르면 들어가도록' -->
    <button class="enter" id="enterBtn"><span id="enterLabel"></span></button>
  </section>

  <footer class="guide" id="guide">
    <img src="assets/v2/guide.jpg" alt="AI 여행 가이드">
    <div class="bubble" id="bubble"></div>
    <button class="hot" data-act="greet" style="left:20px;top:20px;width:340px;height:300px" aria-label="AI 가이드"></button>
    <button class="hot" data-act="talk" style="left:630px;top:25px;width:370px;height:58px" aria-label="무엇이든 물어보세요"></button>
    <button class="hot tog" data-act="voiceOn" style="left:408px;top:262px;width:240px;height:50px"><span class="lbl" data-t="btn.voiceOn"></span></button>
    <button class="hot tog" data-act="mute" style="left:655px;top:262px;width:155px;height:50px"><span class="lbl" data-t="btn.mute"></span></button>
    <button class="hot" data-act="replay" style="left:820px;top:262px;width:180px;height:50px"><span class="lbl" data-t="btn.replay"></span></button>
    <button class="hot" data-act="talk" style="left:55px;top:330px;width:577px;height:77px"><span class="lbl blue" data-t="btn.talk"></span></button>
    <button class="hot" data-act="type" style="left:640px;top:340px;width:360px;height:63px"><span class="lbl" data-t="btn.type"></span></button>
  </footer>

  <nav class="bar" id="bar">
    <img src="assets/v2/bar.jpg" alt="">
    <button class="hot" data-act="home" style="left:30px;top:8px;width:270px;height:80px"><span class="lbl" data-t="btn.home"></span></button>
    <button class="hot lang" data-lang="ko" style="left:418px;top:8px;width:66px;height:80px" aria-label="한국어"></button>
    <button class="hot lang" data-lang="en" style="left:488px;top:8px;width:54px;height:80px" aria-label="English"></button>
    <button class="hot lang" data-lang="ja" style="left:546px;top:8px;width:86px;height:80px" aria-label="日本語"></button>
    <button class="hot lang" data-lang="zh" style="left:636px;top:8px;width:84px;height:80px" aria-label="中文"></button>
    <button class="hot" data-act="admin" style="left:800px;top:8px;width:250px;height:80px" aria-label="여수시"></button>
  </nav>

  <div class="listening" id="listening" hidden>
    <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
    <p id="listenText"></p>
    <button id="listenStop" data-t="stop"></button>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box"><button class="modal-x" id="modalX" aria-label="닫기">✕</button><div id="modalBody"></div></div>
  </div>
  <div class="toast" id="toast"></div>
</main>
</div>

<script src="js/config.js"></script>
<script src="js/sheet-data.js"></script>
<script src="js/bridge.js"></script>
<script src="js/v2-qa.js"></script>
<script src="js/v2-app.js"></script>
</body>
</html>
